<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="mosaic2" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#1E40AF"/>
            <rect x="0" y="0" width="4" height="4" fill="#3B82F6" opacity="0.6"/>
            <rect x="4" y="4" width="4" height="4" fill="#60A5FA" opacity="0.4"/>
            <rect x="4" y="0" width="4" height="4" fill="#2563EB" opacity="0.5"/>
            <rect x="0" y="4" width="4" height="4" fill="#1D4ED8" opacity="0.7"/>
        </pattern>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#93C5FD;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="grad2b" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0A2B4E;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1"/>
        </linearGradient>
        <filter id="shadow2">
            <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
        </filter>
    </defs>
    <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#grad2b)"/>
    <rect x="30" y="30" width="340" height="340" rx="70" fill="url(#mosaic2)"/>
    <g filter="url(#shadow2)">
        <path d="M200 70 L310 130 L310 270 L200 330 L90 270 L90 130 Z" fill="url(#grad2)" stroke="white" stroke-width="3"/>
        <path d="M200 70 L310 130 L200 190 L90 130 Z" fill="white" opacity="0.3"/>
        <path d="M310 130 L310 270 L200 330 L200 190 Z" fill="white" opacity="0.1"/>
    </g>
    <text x="200" y="230" text-anchor="middle" font-size="80" font-weight="bold" fill="white" font-family="serif">寅</text>
    <circle cx="150" cy="100" r="6" fill="white" opacity="0.7"/>
    <circle cx="260" cy="160" r="5" fill="white" opacity="0.5"/>
    <text x="200" y="370" text-anchor="middle" font-size="28" font-weight="bold" fill="white" font-family="Inter, sans-serif" opacity="0.9">寅禾星科技</text>
