<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="mosaic1" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#0A2B4E"/>
            <rect x="0" y="0" width="5" height="5" fill="#1E40AF" opacity="0.8"/>
            <rect x="5" y="5" width="5" height="5" fill="#3B82F6" opacity="0.6"/>
            <rect x="5" y="0" width="5" height="5" fill="#2563EB" opacity="0.7"/>
            <rect x="0" y="5" width="5" height="5" fill="#1D4ED8" opacity="0.9"/>
        </pattern>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="shine1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:white;stop-opacity:0.4"/>
            <stop offset="50%" style="stop-color:white;stop-opacity:0"/>
            <stop offset="100%" style="stop-color:white;stop-opacity:0.2"/>
        </linearGradient>
        <filter id="shadow1">
            <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>
    <rect x="20" y="20" width="360" height="360" rx="80" fill="white"/>
    <rect x="30" y="30" width="340" height="340" rx="70" fill="url(#mosaic1)"/>
    <g filter="url(#shadow1)">
        <path d="M200 60 L230 150 L320 150 L250 200 L275 290 L200 240 L125 290 L150 200 L80 150 L170 150 Z" 
              fill="url(#grad1)" stroke="white" stroke-width="4"/>
    </g>
    <path d="M200 60 L230 150 L320 150 L250 200 L275 290 L200 240 L125 290 L150 200 L80 150 L170 150 Z" 
          fill="url(#shine1)"/>
    <circle cx="150" cy="120" r="8" fill="white" opacity="0.8"/>
    <circle cx="240" cy="180" r="6" fill="white" opacity="0.6"/>
    <circle cx="180" cy="240" r="5" fill="white" opacity="0.5"/>
    <text x="200" y="350" text-anchor="middle" font-size="28" font-weight="bold" fill="#0A2B4E" font-family="Inter, sans-serif">寅禾星科技</text>
</svg>