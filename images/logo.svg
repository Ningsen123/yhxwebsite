<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 马赛克纹理 -->
        <pattern id="mosaic" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#0A2B4E"/>
            <rect x="0" y="0" width="4" height="4" fill="#1E40AF" opacity="0.8"/>
            <rect x="4" y="4" width="4" height="4" fill="#3B82F6" opacity="0.6"/>
            <rect x="4" y="0" width="4" height="4" fill="#2563EB" opacity="0.7"/>
            <rect x="0" y="4" width="4" height="4" fill="#1D4ED8" opacity="0.9"/>
        </pattern>
        
        <!-- 主渐变 -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1"/>
        </linearGradient>
        
        <!-- 光泽效果 -->
        <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:white;stop-opacity:0.4"/>
            <stop offset="50%" style="stop-color:white;stop-opacity:0"/>
            <stop offset="100%" style="stop-color:white;stop-opacity:0.2"/>
        </linearGradient>
        
        <!-- 3D阴影 -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- 背景圆角矩形 -->
    <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#mosaic)"/>
    
    <!-- 3D立方体 -->
    <g filter="url(#shadow)">
        <!-- 立方体正面 -->
        <path d="M100 40 L150 65 L150 135 L100 160 L50 135 L50 65 Z" 
              fill="url(#mainGrad)" stroke="white" stroke-width="2"/>
        <!-- 立方体顶部 -->
        <path d="M100 40 L150 65 L100 90 L50 65 Z" 
              fill="white" opacity="0.3"/>
        <!-- 立方体右侧 -->
        <path d="M150 65 L150 135 L100 160 L100 90 Z" 
              fill="white" opacity="0.1"/>
    </g>
    
    <!-- 星星 -->
    <path d="M100 55 L106 75 L127 75 L110 87 L116 107 L100 95 L84 107 L90 87 L73 75 L94 75 Z" 
          fill="white" stroke="url(#mainGrad)" stroke-width="1.5"/>
    
    <!-- 光泽覆盖 -->
    <path d="M100 55 L106 75 L127 75 L110 87 L116 107 L100 95 L84 107 L90 87 L73 75 L94 75 Z" 
          fill="url(#shine)"/>
    
    <!-- 高光点 -->
    <circle cx="85" cy="70" r="4" fill="white" opacity="0.8"/>
    <circle cx="115" cy="85" r="3" fill="white" opacity="0.6"/>
    <circle cx="95" cy="100" r="2" fill="white" opacity="0.5"/>
    
    <!-- 寅 字 (可选) -->
    <text x="100" y="130" text-anchor="middle" font-size="24" font-weight="bold" 
          fill="white" font-family="serif" opacity="0.9">寅</text>
</svg>