<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="mosaic4" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#667eea"/>
            <rect x="0" y="0" width="4" height="4" fill="#764ba2" opacity="0.6"/>
            <rect x="4" y="4" width="4" height="4" fill="#8B5CF6" opacity="0.5"/>
            <rect x="4" y="0" width="4" height="4" fill="#A78BFA" opacity="0.4"/>
            <rect x="0" y="4" width="4" height="4" fill="#7C3AED" opacity="0.7"/>
        </pattern>
        <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E0E7FF;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#C7D2FE;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#A5B4FC;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="grad4b" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
        </linearGradient>
        <filter id="shadow4">
            <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>
    <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#grad4b)"/>
    <rect x="30" y="30" width="340" height="340" rx="70" fill="url(#mosaic4)"/>
    <g filter="url(#shadow4)">
        <path d="M120 80 L170 180 L170 280 L200 280 L200 180 L250 80" 
              stroke="url(#grad4)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g filter="url(#shadow4)">
        <path d="M250 80 L250 280 M250 180 L320 180 M320 80 L320 280" 
              stroke="url(#grad4)" stroke-width="16" fill="none" stroke-linecap="round"/>
    </g>
    <circle cx="130" cy="100" r="6" fill="white" opacity="0.7"/>
    <circle cx="280" cy="120" r="5" fill="white" opacity="0.6"/>
    <circle cx="200" cy="250" r="4" fill="white" opacity="0.5"/>
    <text x="200" y="350" text-anchor="middle" font-size="28" font-weight="bold" fill="white" font-family="Inter, sans-serif" opacity="0.9">寅禾星科技</text>
