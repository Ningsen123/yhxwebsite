<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="mosaic3" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" fill="#1a1a2e"/>
            <rect x="0" y="0" width="3.5" height="3.5" fill="#2d2d44" opacity="0.8"/>
            <rect x="3.5" y="3.5" width="3.5" height="3.5" fill="#3d3d5c" opacity="0.6"/>
        </pattern>
        <linearGradient id="grad3" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#10B981;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#34D399;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#6EE7B7;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="grad3b" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#059669;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1"/>
        </linearGradient>
        <filter id="shadow3">
            <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
    </defs>
    <rect x="20" y="20" width="360" height="360" rx="80" fill="#1a1a2e"/>
    <rect x="30" y="30" width="340" height="340" rx="70" fill="url(#mosaic3)"/>
    <g filter="url(#shadow3)">
        <ellipse cx="200" cy="320" rx="80" ry="20" fill="#059669" opacity="0.5"/>
        <path d="M200 320 L200 180" stroke="url(#grad3b)" stroke-width="12" stroke-linecap="round"/>
        <path d="M200 240 Q140 180 160 140" stroke="url(#grad3)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M200 240 Q260 180 240 140" stroke="url(#grad3)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M200 200 Q130 150 155 100" stroke="url(#grad3)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M200 200 Q270 150 245 100" stroke="url(#grad3)" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M200 60 L212 100 L255 100 L220 125 L232 165 L200 142 L168 165 L180 125 L145 100 L188 100 Z" 
          fill="url(#grad3)" stroke="white" stroke-width="3"/>
    <circle cx="180" cy="90" r="6" fill="white" opacity="0.7"/>
    <circle cx="220" cy="120" r="5" fill="white" opacity="0.6"/>
    <circle cx="190" cy="150" r="4" fill="white" opacity="0.5"/>
